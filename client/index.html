    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker (client/public/sw.js → served at /sw.js).
      // Required for iOS 16.4+ PWA push notifications and offline caching.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.debug('[SW] registered', reg.scope))
            .catch(err => console.warn('[SW] registration failed:', err));
        });
      }
    </script>
