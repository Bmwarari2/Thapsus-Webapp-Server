<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Preconnect to Google Fonts (eliminates ~200ms DNS+TLS per origin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking font loading (swap from CSS @import → async link) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" /></noscript>
    <!-- Theme color: tints browser/OS chrome — Android Chrome picks the first match,
         iOS Safari uses the apple-mobile-web-app-status-bar-style meta below.
         We supply both a light and dark variant so the tint tracks the OS colour scheme. -->
    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <meta name="description" content="Thapsus Cargo — affordable, reliable shipping and forwarding from the UK &amp; China to Kenya. Track packages, calculate instant quotes, and enjoy door-to-door delivery." />
    <meta name="keywords" content="shipping to Kenya, UK to Kenya shipping, China to Kenya cargo, freight forwarding Kenya, package delivery Kenya, Thapsus Cargo, international shipping Kenya, parcel forwarding, online shopping delivery Kenya" />
    <link rel="canonical" href="https://thapsus.uk/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thapsus.uk/" />
    <meta property="og:title" content="Thapsus Cargo — Ship from UK &amp; China to Kenya" />
    <meta property="og:description" content="Affordable, reliable shipping and forwarding from the UK &amp; China to Kenya. Track packages, get instant quotes, and enjoy door-to-door delivery." />
    <meta property="og:image" content="https://thapsus.uk/og-image.png" />
    <meta property="og:site_name" content="Thapsus Cargo" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://thapsus.uk/" />
    <meta name="twitter:title" content="Thapsus Cargo — Ship from UK &amp; China to Kenya" />
    <meta name="twitter:description" content="Affordable, reliable shipping and forwarding from the UK &amp; China to Kenya. Track packages, get instant quotes, and enjoy door-to-door delivery." />
    <meta name="twitter:image" content="https://thapsus.uk/og-image.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Thapsus Cargo",
      "url": "https://thapsus.uk",
      "logo": "https://thapsus.uk/favicon.svg",
      "description": "Affordable, reliable shipping and forwarding from the UK and China to Kenya.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "availableLanguage": ["English", "Swahili"]
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Thapsus Cargo",
      "description": "International shipping and forwarding service from UK and China to Kenya",
      "url": "https://thapsus.uk",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "31 Collingwood Close, Hazel Grove",
        "addressLocality": "Stockport",
        "postalCode": "SK7 4LB",
        "addressCountry": "GB"
      },
      "priceRange": "$$",
      "serviceArea": [
        { "@type": "Country", "name": "Kenya" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "China" }
      ]
    }
    </script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS / iPadOS PWA chrome tinting -->
    <!-- "yes" lets the app run full-screen when added to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent = status bar overlays content and adopts the app's background colour -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thapsus Cargo" />

    <!-- MS / Windows tile colour (bonus) -->
    <meta name="msapplication-TileColor" content="#1e3a5f" />

    <title>Thapsus Cargo — Affordable Shipping from UK &amp; China to Kenya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker (client/public/sw.js → served at /sw.js).
      // Required for iOS 16.4+ PWA push notifications and offline caching.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.debug('[SW] registered', reg.scope))
            .catch(err => console.warn('[SW] registration failed:', err));
        });
      }
    </script>
  </body>
</html>
