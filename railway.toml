[build]
  builder = "nixpacks"
  buildCommand = "npm install && cd client && npm install --include=dev && npm run build && cd .."

[deploy]
  startCommand = "node server.js"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

[[volumes]]
  mountPath = "/data"
