[build]
  builder = "nixpacks"
  # --include=dev ensures Vite (a devDependency) is available during the client build step.
  # Without this flag Railway's production npm install omits devDeps and the build fails.
  buildCommand = "npm install --include=dev && cd client && npm install --include=dev && npm run build && cd .."

[deploy]
  startCommand = "node server.js"
  healthcheckPath = "/health"
  healthcheckTimeout = 30
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

[[volumes]]
  mountPath = "/data"
