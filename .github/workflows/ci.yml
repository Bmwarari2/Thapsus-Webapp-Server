# Renamed from test.yml on 2026-08-12. GitHub keys a workflow's
# enabled/disabled state to its FILE PATH, and both workflows in this repo
# had been switched off manually since May — every PR since then merged
# with no CI at all. A new path registers a new workflow, which is enabled
# by default. Don't rename it back.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual runs so a developer can re-trigger the integration suite
  # against a specific TEST_DATABASE_URL when debugging — without pushing
  # a fixup commit just to re-run CI.
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a newer commit lands. Saves
# CI minutes when a developer pushes a fixup commit a second after the
# previous one started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit + smoke (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` is the CI-safe install: refuses to silently mutate
        # package-lock.json, which is exactly what we want here.
        run: npm ci

      # The unit + smoke suites do not need a live database — they
      # mock at the route-handler boundary or hit only routes that
      # don't query the pool. The integration suites (auth + role
      # matrix) self-skip when TEST_DATABASE_URL is unset, which is
      # the case here; the dedicated `integration` job below picks
      # them up when the secret is configured.
      - name: Run vitest
        run: npm test

      # Build the React client too — catches lockfile drift, missing
      # imports, broken JSX. Cheap signal to keep on every PR.
      - name: Build client
        run: cd client && npm ci && npm run build

  # Integration + schema gates against a hermetic prod-mirror Postgres.
  #
  # Since the 2026-07 consolidated baseline (database/migrations/
  # 0000_baseline.sql — fingerprint-identical to the live schema), a prod
  # mirror is just: fresh Postgres + database/dev/supabase-shims.sql +
  # `npm run migrate`. No secrets, no long-lived test project, works on
  # forks and Dependabot PRs alike. This replaced the earlier
  # secret-gated job that pointed at a paid test Supabase project and in
  # practice never ran.
  #
  # Gates, in order:
  #   1. migrate       — the baseline + every newer migration applies cleanly
  #   2. migrate:check — no .sql file left out of the ledger
  #   3. check:drift   — no code SQL references a missing table/column
  #                      (the class of bug behind the 2026 production outages)
  #   4. seed:dev      — the dev seeder stays compatible with the schema
  #   5. npm test      — full suite INCLUDING the DB-gated integration
  #                      suites (auth, role matrix, finance, last-mile/cargo)
  integration:
    name: integration (prod-mirror Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17 # match the live project's major version
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thapsus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/thapsus_ci
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Roles, auth/storage schemas, auth.uid()/jwt(), realtime publication —
      # everything the baseline references that Supabase provides natively.
      - name: Apply Supabase shims
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/dev/supabase-shims.sql

      - name: Apply migrations (baseline + newer)
        run: npm run migrate

      - name: Gate — no unapplied migrations
        run: npm run migrate:check

      - name: Gate — no code/schema drift
        run: npm run check:drift

      - name: Seed dev data
        run: npm run seed:dev

      - name: Run full suite (DB integration included)
        env:
          # Same URL, distinct var by design: tests only touch a DB when
          # TEST_DATABASE_URL is explicitly set, so a stray `npm test`
          # can never aim the destructive suites at a real DATABASE_URL.
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/thapsus_ci
          NODE_ENV: development
        run: npm test

  # Browser e2e over the surfaces staff work in (sign-in, pipeline board,
  # inbox, payment queue, receipt links) — drives the BUILT client against
  # the same hermetic prod-mirror Postgres the integration job uses.
  # Catches "API works but the screen wires it wrong" breaks that no
  # server test can see.
  e2e:
    name: e2e (browser money paths)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thapsus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/thapsus_e2e
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build client
        run: cd client && npm ci && npm run build

      - name: Prepare prod-mirror database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/dev/supabase-shims.sql
          npm run migrate
          npm run seed:dev

      - name: Run Playwright suite
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/thapsus_e2e
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  # Audit W6.3 — accessibility regression guard.
  # Runs lighthouse-ci against the built static bundle and fails if the
  # accessibility category score drops below 0.9 (90%). Performance,
  # best-practices, and SEO categories are intentionally OFF — they're
  # noisier and we only commit to a11y here. Tighten later if needed.
  lighthouse:
    name: lighthouse a11y
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build client
        run: cd client && npm ci && npm run build

      # The treosh action installs lhci, runs `collect` against the
      # static dir defined in .lighthouserc.json, then `assert`s the
      # thresholds. configPath is relative to the repo root.
      - name: Lighthouse CI (a11y assertion)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
