name: CodeQL

# CodeQL static analysis (audit F-12). Catches injection, XSS, prototype
# pollution, regex DoS, hard-coded secrets, etc. that get past the existing
# unit + integration suite. Pairs with Dependabot (audit F-11).
#
# Upload mode: SARIF is uploaded as a workflow artifact, NOT to the GitHub
# Security tab. The Security tab requires GitHub Advanced Security (GHAS),
# which is a paid feature on private repos. This repo is private + free
# tier, so GHAS isn't available. The earlier upload-to-Security-tab path
# was failing every run with "Code scanning is not enabled for this
# repository". Workflow artifacts give us the same SARIF data, downloadable
# from the Actions run page; if the repo ever goes public (or GHAS is
# turned on later), flip `upload: never` back to `upload: always` and
# delete the artifact step.

on:
  pull_request:
    branches: [JS1, main]
    # Skip CodeQL for changes that can't introduce new vulns — saves ~5 min
    # of analysis time on doc-only PRs while still covering every code change.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/dependabot.yml"
  push:
    branches: [JS1, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/dependabot.yml"
  schedule:
    # Weekly Monday 06:00 UTC scan to catch newly-disclosed CVEs that match
    # patterns in code we haven't touched.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  # No security-events:write — we don't upload to the Security tab on this
  # private repo (no GHAS). Switch back if the repo goes public or GHAS
  # is enabled.

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` is the modern combined extractor — covers
        # both backend (.js, ESM) and the React webapp (.jsx, .tsx if any).
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds extra vuln queries above the default set
          # without crossing into the noisier security-and-quality bucket.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: sarif-results
          retention-days: 30
          if-no-files-found: warn
