version: 2
updates:
  # Backend Express + Supabase deps
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    target-branch: JS1
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # Group all non-major patch + minor bumps so the queue isn't overwhelming.
    # Major bumps still come as individual PRs — see reference_dep_major_gotchas.md
    # in the iOS repo for known traps (Express 5, Vite 8, Lucide v1, etc.).
    groups:
      backend-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    # Pin majors that need a deliberate migration plan, not an auto-bump:
    #   - vitest        — must move in lockstep with @vitest/coverage-v8 + the
    #                      @vitest/* family. Dependabot opens single-package PRs
    #                      for majors, so a vitest 4 bump on its own breaks the
    #                      coverage peer (PR #172 hit ERESOLVE in CI for exactly
    #                      this). Migrate vitest + coverage-v8 + any @vitest/*
    #                      siblings together in one coordinated PR.
    #   - @vitest/*     — same lockstep rule (covers @vitest/coverage-v8,
    #                      @vitest/expect, @vitest/spy, @vitest/utils, etc.)
    #   - vite          — v8 dropped esbuild bundling (per reference_dep_major_gotchas.md);
    #                      PR #175 opened as a clean rebase but was rejected.
    #                      Same major as the /client section's vite pin.
    #   - @vitejs/*     — sibling-peer with vite. PR #173 hit ERESOLVE because
    #                      @vitejs/plugin-react@6 requires vite ^8 but root has
    #                      vite ^7.3.2. Move them in lockstep with vite itself.
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/*"
        update-types:
          - version-update:semver-major

  # React webapp deps
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    target-branch: JS1
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps/client)"
      include: scope
    groups:
      client-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    # Pin majors that need a deliberate migration plan, not an auto-bump:
    #   - vite          — v8 dropped esbuild bundling (per reference_dep_major_gotchas.md)
    #   - @vitejs/*     — sibling-peer with vite (PR #174 hit ERESOLVE because
    #                      @vitejs/plugin-react@6 needs vite ^8). Lockstep.
    #   - lucide-react  — v1 has a separate bump branch open; land manually
    #   - tailwindcss   — v4 is a complete engine rewrite (Lightning CSS, no PostCSS;
    #                      new @config-in-CSS format; @tailwindcss/forms needs the
    #                      v4-compat release; removed legacy classes; different
    #                      defaults). PR #171 opened as a clean rebase but was
    #                      rejected for these reasons — see that PR's close comment.
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/*"
        update-types:
          - version-update:semver-major
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major

  # GitHub Actions used by .github/workflows/test.yml + future CodeQL job
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    target-branch: JS1
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps/actions)"
      include: scope
